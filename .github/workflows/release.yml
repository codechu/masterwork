name: release
# Publishes to PyPI ONLY on a version tag — cutting the tag is the human
# release signature. Requires a PyPI trusted publisher for codechu/masterwork
# and this workflow (no token in the repo).
on:
  push: {tags: ["v*"]}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    # contents: write — the last step creates the GitHub release from the
    # tag. With contents: read it 403s AFTER the package is already on PyPI,
    # which is the worst place to fail: the upload cannot be repeated.
    permissions: {id-token: write, contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Nothing checked the tag against the packaged version, so a tag could
      # ship a package stamped with something else entirely.
      - name: tag matches the packaged version
        run: |
          v="${GITHUB_REF_NAME#v}"
          p=$(python - <<'PY'
          import re
          print(re.search(r'(?m)^version = "([^"]+)"',
                          open("pyproject.toml").read()).group(1))
          PY
          )
          [ "$v" = "$p" ] || { echo "tag $GITHUB_REF_NAME vs packaged $p"; exit 1; }
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python -m pytest tests/ -q
      - run: python examples/held_at_gate.py
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: github release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          v="${GITHUB_REF_NAME#v}"
          python - "$v" > /tmp/notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## {re.escape(v)}[^\n]*\n(.*?)(?=^## |\Z)",
                        text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section for {v} — the changelog "
                       f"entry is the release note, so there is nothing to "
                       f"publish. Add '## {v} — <date>' and re-run.")
          sys.stdout.write(m.group(1).strip() + "\n")
          PY
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::a release for $GITHUB_REF_NAME already exists;" \
                 "leaving its notes alone rather than overwriting them"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --verify-tag --notes-file /tmp/notes.md
          fi
