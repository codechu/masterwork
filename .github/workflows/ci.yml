name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.10", "3.11", "3.12", "3.13", "3.14"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install pytest
      # The offline proof first: it is what the README opens with, and a
      # reader who cannot run it has no reason to believe the rest.
      - run: python examples/held_at_gate.py
      - run: python -m masterwork gate gates/
      - run: python -m pytest tests/ -q
